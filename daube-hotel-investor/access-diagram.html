<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bone: #F5F1E8;
    --ink: #1A1714;
    --ink-soft: #5A524A;
    --oxblood: #7B2D26;
    --red: #9F2E22;
    --brass: #A8843D;
    --line: #C7B9A1;
    --serif: 'Fraunces', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bone); }
  #stage { width: 600px; height: 600px; background: var(--bone); }
  svg { display: block; }
  .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.13em; fill: var(--ink-soft); }
  .lbl--brass { fill: var(--brass); }
  .name { font-family: var(--serif); font-size: 21px; font-weight: 500; letter-spacing: 0.01em; fill: var(--ink); }
  .addr { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; fill: var(--ink-soft); }
</style>
</head>
<body>
<div id="stage">
  <svg width="600" height="600" viewBox="0 0 600 600">
    <defs>
      <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
        <path d="M1,1 L7,4.5 L1,8" fill="none" stroke="var(--red)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- grid axes -->
    <line x1="42" y1="0" x2="42" y2="600" stroke="var(--line)" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="600" stroke="var(--line)" stroke-width="1"/>
    <line x1="0" y1="315" x2="600" y2="315" stroke="var(--line)" stroke-width="1"/>

    <!-- dashed catchment circle -->
    <circle cx="300" cy="315" r="205" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 7"/>

    <!-- arrows -->
    <line x1="300" y1="188" x2="300" y2="40"  stroke="var(--red)" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="300" y1="468" x2="300" y2="560" stroke="var(--red)" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="42"  y1="305" x2="42"  y2="236" stroke="var(--red)" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="42"  y1="325" x2="42"  y2="392" stroke="var(--red)" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="362" y1="366" x2="458" y2="396" stroke="var(--red)" stroke-width="1.4" marker-end="url(#arr)"/>

    <!-- center target -->
    <circle cx="300" cy="315" r="26" fill="none" stroke="var(--red)" stroke-width="1.2" opacity="0.55"/>
    <circle cx="300" cy="315" r="16" fill="none" stroke="var(--red)" stroke-width="1.2"/>
    <circle cx="300" cy="315" r="7.5" fill="var(--red)"/>

    <!-- center label -->
    <text x="300" y="264" text-anchor="middle" class="name">BOUTIQUE HOTEL</text>
    <text x="300" y="281" text-anchor="middle" class="addr">105 E. Main St.</text>
    <text x="300" y="294" text-anchor="middle" class="addr">Ardmore, OK</text>

    <!-- corridor / driver labels -->
    <text x="108" y="82"  class="lbl">I-35</text>
    <text x="108" y="98"  class="lbl lbl--brass">10.9M VPY</text>

    <text x="312" y="58"  class="lbl">TURNER FALLS 18 MI</text>

    <text x="312" y="142" class="lbl">AMTRAK HEARTLAND FLYER</text>
    <text x="312" y="158" class="lbl lbl--brass">80K PAX · 1 BLOCK</text>

    <text x="516" y="319" class="lbl">MAIN ST.</text>
    <text x="300" y="352" text-anchor="middle" class="lbl">DOWNTOWN PEDESTRIAN</text>
    <text x="470" y="420" class="lbl">LAKE MURRAY 18 MI</text>

    <text x="56" y="276" class="lbl">OKC 95 MI</text>
    <text x="48" y="364" class="lbl">DALLAS 95 MI</text>

    <text x="300" y="580" text-anchor="middle" class="lbl">WINSTAR 18 MI</text>
  </svg>
</div>
</body>
</html>
